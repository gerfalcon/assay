rules:
  - id: no-context-todo
    languages: [go]
    severity: WARNING
    message: >-
      context.TODO() is a placeholder the author meant to replace. Thread the
      caller's context through, or use context.Background() and say why.
    metadata:
      category: maintainability
      evidence: 0.06 and 0.00 per kLOC across two production Go services
      confidence: high
    pattern: context.TODO()
    paths:
      exclude: ["*_test.go"]
